
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Student Marks Management System</h1>
        <form id="marksForm">
            <input type="text" id="name" placeholder="Student Name" required>
            <input type="number" id="m1" placeholder="Subject 1 Marks" min="0" max="100" required>
            <input type="number" id="m2" placeholder="Subject 2 Marks" min="0" max="100" required>
            <input type="number" id="m3" placeholder="Subject 3 Marks" min="0" max="100" required>
            <button type="submit">Calculate Result</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
